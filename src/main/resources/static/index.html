<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Wallet</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; background:#f4f6fb; margin:0; }
  .wrap { max-width:640px; margin:40px auto; background:#fff; border-radius:12px; padding:28px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:22px; }
  .user { color:#666; margin-bottom:20px; }
  .balance { font-size:36px; font-weight:700; color:#1f7a3f; margin:8px 0 24px; }
  .row { display:flex; gap:10px; margin-bottom:12px; }
  input { flex:1; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:15px; }
  button { padding:10px 16px; border:0; border-radius:8px; color:#fff; font-size:15px; cursor:pointer; }
  .add { background:#2e7d32; } .wd { background:#c62828; }
  .msg { min-height:20px; margin:6px 0 16px; font-size:14px; }
  .err { color:#c62828; } .ok { color:#2e7d32; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid #eee; }
  .CREDIT { color:#2e7d32; } .DEBIT { color:#c62828; }
  a { color:#555; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Wallet</h1>
  <div class="user">Logged in as <b id="user">...</b> · <a href="/logout">Log out</a></div>
  <div>Current balance</div>
  <div class="balance" id="balance">₹0.00</div>
  <div class="row"><input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount (₹)">
    <button class="add" onclick="txn('add')">Add money</button>
    <button class="wd" onclick="txn('withdraw')">Withdraw</button></div>
  <div class="msg" id="msg"></div>
  <h3>Transaction history</h3>
  <table><thead><tr><th>#</th><th>Type</th><th>Amount</th><th>Balance after</th><th>Time</th></tr></thead>
    <tbody id="hist"></tbody></table>
</div>
<script>
const fmt = v => '₹' + Number(v).toFixed(2);
async function load() {
  const b = await (await fetch('/api/wallet/balance')).json();
  document.getElementById('user').textContent = b.username;
  document.getElementById('balance').textContent = fmt(b.balance);
  const h = await (await fetch('/api/wallet/transactions')).json();
  document.getElementById('hist').innerHTML = h.length ? h.map(t =>
    `<tr><td>${t.id}</td><td class="${t.type}">${t.type}</td><td>${fmt(t.amount)}</td><td>${fmt(t.balanceAfter)}</td><td>${t.createdAt.replace('T',' ').slice(0,19)}</td></tr>`).join('')
    : '<tr><td colspan="5">No transactions yet</td></tr>';
}
async function txn(kind) {
  const msg = document.getElementById('msg');
  const amount = document.getElementById('amount').value;
  const r = await fetch('/api/wallet/' + kind, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ amount: amount === '' ? null : Number(amount) }) });
  const body = await r.json();
  if (r.ok) { msg.className = 'msg ok'; msg.textContent = (kind === 'add' ? 'Added ' : 'Withdrew ') + fmt(amount); document.getElementById('amount').value=''; }
  else { msg.className = 'msg err'; msg.textContent = body.error; }
  load();
}
load();
</script>
</body>
</html>
